[package]
name = "ailo"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "An HTTP client for AI agents — call APIs without pouring the whole response into the context window"
license = "MIT"
repository = "https://github.com/asriel-dev-apps/ailo"
keywords = ["http", "cli", "api", "agent"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "wrap_help"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_json_path = "0.7"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing"] }
toml = "0.8"

# rustls-tls: OS の OpenSSL に依存せず、単一バイナリのまま配布するため。
# blocking を使わないのは、後で入れる SSE で非同期が要るため。今から async で組んでおく。
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "http2",
  "json",
  "multipart",
  "gzip",
  "brotli",
  "charset",
] }
tokio = { version = "1", features = ["rt", "macros", "fs", "io-util"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
