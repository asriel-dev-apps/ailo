[package]
name = "ailo"
version = "0.1.0"
edition = "2021"
# 1.87: keychain.rs が使う `usize::is_multiple_of`。bitbucket-tui から流用した箇所。
rust-version = "1.87"
description = "An HTTP client for AI agents — call APIs without pouring the whole response into the context window"
license = "MIT"
repository = "https://github.com/asriel-dev-apps/ailo"
keywords = ["http", "cli", "api", "agent"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "wrap_help"] }
# libloading は Linux の Secret Service(libsecret)を実行時 dlopen で呼ぶための依存(cargo 公式の
# cargo-credential-libsecret と同方式)。ビルド時リンクや zbus 系の重い依存を避ける。target 依存に
# せず通常依存にしているのは意図的: libsecret バックエンドのモジュールを全 OS でコンパイル対象に
# して、macOS 上の check/clippy/test でも Linux 向けコードの大半を検証できるようにするため
# (dlopen は実行時にしか起きないので macOS ビルドに実害はない)。
libloading = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_json_path = "0.7"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing"] }
toml = "0.8"
# toml_edit は「読んで書き戻す」ため。`config.toml` は人が手で書くファイルなので、
# 値を 1 つ変えるたびにコメントと並びが消えるのは実質的な破壊になる。
toml_edit = "0.22"

# rustls-tls: OS の OpenSSL に依存せず、単一バイナリのまま配布するため。
# blocking を使わないのは、後で入れる SSE で非同期が要るため。今から async で組んでおく。
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "http2",
  "json",
  "multipart",
  "gzip",
  "brotli",
  "charset",
] }
# time は TUI のため。送信中もイベントを拾い続けるのに、短い sleep と select が要る。
tokio = { version = "1", features = ["rt", "macros", "fs", "io-util", "time"] }
# TUI。bitbucket-tui / specto / launchtop と同じ ratatui に揃える。
# crossterm は直接依存にしない。ratatui が `ratatui::crossterm` として再輸出しており、
# 別々に固定すると版がずれた瞬間に「型は合うのにイベントが来ない」壊れ方をする。
ratatui = "0.29"

[dev-dependencies]
# 実 API の大半は gzip を返す。ailo は自分で gzip/brotli を有効にしているのに、
# テストのレスポンスが常に非圧縮では復号経路を一度も通らない。
flate2 = "1"
tempfile = "3"
unicode-width = "0.2"

[profile.release]
lto = true
codegen-units = 1
strip = true
